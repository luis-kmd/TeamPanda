<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/login/style.css" />
    <script src="/login/script.js" defer></script>
    <title>Login</title>
    <style>
        /* Estilo para mensagens de erro */
        .flash-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #f5c6cb;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="forms-container">
            <div class="signin-signup">
                <form action="/login" method="post" class="sign-in-form">
                    <h2 class="title">Entrar</h2>
                    <div id="mensagem-erro" class="flash-message" style="display: none;"></div>
                    <div class="input-field">
                        <i class="fas fa-id-card"></i> <input type="text" name="cpf" id="login-cpf" placeholder="CPF" required />
                    </div>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="senha" placeholder="Senha" required />
                    </div>
                    <input type="submit" value="Login" class="btn solid" />
                    <p style="margin-top: 10px; cursor: pointer; color: #444; font-size: 0.9rem;" id="btn-forgot">
                        Esqueci minha senha
                    </p>
                    <p>Nossas redes sociais !</p>
                    <div class="social-media">
                        <a href="https://www.instagram.com/teampandaacademia/" class="social-icon">
                            <i class="bi bi-instagram"></i></a>
                        <a href="#" class="social-icon">
                            <i class="bi bi-whatsapp"></i>
                        </a>
                    </div>
                </form>
                <form action="#" class="sign-up-form">
                    <div class="video-container">
                        <video class="video" src="/login/videos/teampanda.mp4" controls height="500px"
                            poster="/login/img/thumb.png"></video>
                    </div>
                </form>
            </div>
        </div>

        <div class="panels-container">
            <div class="panel left-panel">
                <div class="content">
                    <h3>Novo aqui ?</h3>
                    <p>
                        Para saber mais sobre a TeamPanda e como funciona o nosso cadastro,
                        clique no botão abaixo.
                    </p>
                    <button class="btn transparent" id="sign-up-btn">
                        Saiba mais
                    </button>
                </div>
                <img src="/login/img/pandao.png" class="image" alt="" />
            </div>
            <div class="panel right-panel">
                <div class="content">
                    <h3>Já possui um cadastro ?</h3>
                    <p>
                        Clique no botão abaixo para entrar.<br>
                        Caso não, compareça à academia para se matricular.
                    </p>
                    <button class="btn transparent" id="sign-in-btn">
                        Entrar
                    </button>
                </div>
                <img src="/login/img/pandao.png" class="image" alt="" />
            </div>
        </div>
    </div>

</body>

</html>
